<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Convertly: file tools with private, on-device AI</title>
  <desc id="desc">A private browser workspace for converting files, chatting with documents, creating PowerPoint decks, transcribing audio, reading scans, and removing image backgrounds.</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8F76A" stop-opacity=".2"/>
      <stop offset="1" stop-color="#D8F76A" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#071009" flood-opacity=".24"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1440" height="900" fill="#e9e8e2"/>
  <rect x="44" y="42" width="1352" height="816" rx="38" fill="#101512"/>
  <rect x="44" y="42" width="1352" height="816" rx="38" fill="url(#grid)"/>
  <ellipse cx="357" cy="211" rx="402" ry="300" fill="url(#glow)"/>

  <g transform="translate(100 96)">
    <rect width="50" height="50" rx="15" fill="#d8f76a"/>
    <path d="M15 13h13a3 3 0 0 1 3 3v19H18a3 3 0 0 1-3-3z" fill="none" stroke="#101512" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M22 17h13a3 3 0 0 1 3 3v19H25a3 3 0 0 1-3-3z" fill="#101512"/>
    <text x="66" y="34" fill="#f4f5f1" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="-.7">Convertly</text>
  </g>
  <g transform="translate(100 226)">
    <circle cx="6" cy="5" r="5" fill="#d8f76a"/>
    <text x="22" y="10" fill="#d8f76a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">FREE FILE TOOLS · PRIVATE AI</text>
  </g>
  <text x="100" y="356" fill="#f4f5f1" font-family="Arial, Helvetica, sans-serif" font-size="69" font-weight="700" letter-spacing="-3.2">Convert files.</text>
  <text x="100" y="438" fill="#f4f5f1" font-family="Arial, Helvetica, sans-serif" font-size="69" font-weight="700" letter-spacing="-3.2">Keep AI local.</text>
  <text x="102" y="497" fill="#a9b2ab" font-family="Arial, Helvetica, sans-serif" font-size="20">Convert, fix and understand your files</text>
  <text x="102" y="527" fill="#a9b2ab" font-family="Arial, Helvetica, sans-serif" font-size="20">without sending them anywhere.</text>

  <g transform="translate(100 592)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing=".5">
    <rect width="142" height="38" rx="19" fill="#202922" stroke="#37433a"/>
    <text x="71" y="24" text-anchor="middle" fill="#f4f5f1">PDF  ↔  PPTX</text>
    <rect x="154" width="143" height="38" rx="19" fill="#202922" stroke="#37433a"/>
    <text x="225" y="24" text-anchor="middle" fill="#f4f5f1">AI ON DEVICE</text>
    <rect x="309" width="132" height="38" rx="19" fill="#202922" stroke="#37433a"/>
    <text x="375" y="24" text-anchor="middle" fill="#f4f5f1">NO UPLOADS</text>
  </g>
  <g transform="translate(100 754)">
    <path d="M0 0h36" stroke="#d8f76a" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="31" fill="#89938b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">A QUIETLY CAPABLE WORKSPACE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="684" y="92" width="652" height="716" rx="29" fill="#f8f8f5"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(716 122)">
      <rect width="34" height="34" rx="10" fill="#101512"/>
      <path d="M9 9h9a2 2 0 0 1 2 2v13h-9a2 2 0 0 1-2-2z" fill="none" stroke="#d8f76a" stroke-width="1.8"/>
      <path d="M14 12h9a2 2 0 0 1 2 2v13h-9a2 2 0 0 1-2-2z" fill="#d8f76a"/>
      <text x="46" y="23" fill="#151a16" font-size="17" font-weight="700">Convertly</text>
      <text x="587" y="21" text-anchor="end" fill="#777f78" font-size="12">YOUR PRIVATE WORKSPACE</text>
    </g>
    <path d="M716 174h588" stroke="#e5e7e1"/>
    <g transform="translate(716 174)" font-size="13" font-weight="600">
      <text x="22" y="35" fill="#777f78">Convert</text>
      <text x="108" y="35" fill="#777f78">Tools</text>
      <text x="174" y="35" fill="#151a16">AI</text>
      <text x="224" y="35" fill="#777f78">Download</text>
      <path d="M168 53h26" stroke="#101512" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <path d="M716 228h588" stroke="#e5e7e1"/>
    <text x="720" y="276" fill="#171c18" font-size="28" font-weight="700" letter-spacing="-.8">Private AI.</text>
    <text x="720" y="304" fill="#737c74" font-size="14">Useful tools, running right in your browser.</text>
    <g transform="translate(1151 254)">
      <rect width="150" height="29" rx="14.5" fill="#edf4dc"/>
      <circle cx="15" cy="14.5" r="4" fill="#638326"/>
      <text x="28" y="19" fill="#526d20" font-size="10" font-weight="700" letter-spacing=".7">ON YOUR DEVICE</text>
    </g>

    <g transform="translate(720 335)">
      <rect width="280" height="149" rx="16" fill="#fff" stroke="#e3e6df"/>
      <rect x="18" y="18" width="42" height="42" rx="12" fill="#f0f2eb"/>
      <path d="M30 29h14v19H30zM34 25h14v19" fill="none" stroke="#222a23" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="18" y="86" fill="#202620" font-size="16" font-weight="700">Ask a document</text>
      <text x="18" y="109" fill="#747d75" font-size="13">Chat with PDFs and Word files</text>
      <text x="18" y="129" fill="#747d75" font-size="13">or create a PowerPoint.</text>
    </g>
    <g transform="translate(1016 335)">
      <rect width="280" height="149" rx="16" fill="#fff" stroke="#e3e6df"/>
      <rect x="18" y="18" width="42" height="42" rx="12" fill="#f0f2eb"/>
      <path d="M28 38h4l11-8v25l-11-8h-4zM48 35q7 6 0 12M51 31q12 9 0 19" fill="none" stroke="#222a23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="86" fill="#202620" font-size="16" font-weight="700">Transcribe</text>
      <text x="18" y="109" fill="#747d75" font-size="13">Turn speech into text and</text>
      <text x="18" y="129" fill="#747d75" font-size="13">download subtitles.</text>
    </g>
    <g transform="translate(720 500)">
      <rect width="280" height="149" rx="16" fill="#fff" stroke="#e3e6df"/>
      <rect x="18" y="18" width="42" height="42" rx="12" fill="#f0f2eb"/>
      <rect x="28" y="28" width="22" height="21" rx="2" fill="none" stroke="#222a23" stroke-width="1.8"/>
      <path d="M32 44l5-6 4 4 3-3 4 5M33 34h.1" fill="none" stroke="#222a23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="86" fill="#202620" font-size="16" font-weight="700">Read scans</text>
      <text x="18" y="109" fill="#747d75" font-size="13">Pull text from images, photos</text>
      <text x="18" y="129" fill="#747d75" font-size="13">and scanned PDFs.</text>
    </g>
    <g transform="translate(1016 500)">
      <rect width="280" height="149" rx="16" fill="#fff" stroke="#e3e6df"/>
      <rect x="18" y="18" width="42" height="42" rx="12" fill="#f0f2eb"/>
      <circle cx="39" cy="38" r="10" fill="none" stroke="#222a23" stroke-width="1.8"/>
      <path d="M33 48l-4 5m16-5 4 5M39 28v20" fill="none" stroke="#222a23" stroke-width="1.8" stroke-linecap="round"/>
      <text x="18" y="86" fill="#202620" font-size="16" font-weight="700">Remove background</text>
      <text x="18" y="109" fill="#747d75" font-size="13">Cut out a subject and keep</text>
      <text x="18" y="129" fill="#747d75" font-size="13">the transparent PNG.</text>
    </g>

    <g transform="translate(720 679)">
      <rect width="576" height="90" rx="14" fill="#eff3e9"/>
      <circle cx="25" cy="27" r="8" fill="#d8f76a"/>
      <path d="M21 27l3 3 6-7" fill="none" stroke="#27321c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="31" fill="#25301d" font-size="14" font-weight="700">Your files stay on your device</text>
      <text x="22" y="58" fill="#63705b" font-size="12.5">No account. No file uploads. Models load only when you choose a tool.</text>
    </g>
  </g>
</svg>
